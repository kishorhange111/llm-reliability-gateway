services:
  gateway:
    build: .
    ports: ["8080:8080"]
    environment:
      GATEWAY_PROVIDERS: ${GATEWAY_PROVIDERS:-mock,mock}
      GATEWAY_TENANTS: "acme:20:40:5;globex:5:10:1"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    read_only: true
  prometheus:
    image: prom/prometheus:v2.53.0
    ports: ["9090:9090"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
