[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-reliability-gateway"
version = "0.1.0"
description = "Production LLM gateway: multi-provider routing, fallback, circuit breakers, retries with jitter, per-tenant rate limits and budgets, caching, Prometheus metrics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kishor Hange" }]
dependencies = ["fastapi>=0.110", "pydantic>=2", "prometheus-client>=0.20", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]
anthropic = ["anthropic>=0.40"]

[project.scripts]
gateway-sim = "gateway.sim:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
